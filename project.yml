name: ReadyPlayerTwo

minimumXcodeGenVersion: 2.46.0

options:
  bundleIdPrefix: com.aneeshsathe
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  projectFormat: xcode16_3
  xcodeVersion: "26.6"

packages:
  CompanionRuntime:
    path: Packages/CompanionRuntime
  WebRTC:
    # M150 binary SHA-256: f9890492b0016e4c88ab20f07867b8b420054caedc8a692b2ec6ac041f3cf6b2
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 150.0.0

settings:
  base:
    ARCHS: arm64
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"

targets:
  ReadyPlayerTwo:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: App/ReadyPlayerTwo
        excludes:
          - Info.plist
          - ReadyPlayerTwo.entitlements
      - path: assets
        type: folder
        buildPhase: resources
    dependencies:
      - package: CompanionRuntime
      - package: WebRTC
        product: WebRTC
    info:
      path: App/ReadyPlayerTwo/Info.plist
      properties:
        CFBundleDisplayName: ReadyPlayerTwo
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 1
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSMultipleInstancesProhibited: true
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: ReadyPlayerTwo uses your microphone only during a conversation you explicitly start.
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: App/ReadyPlayerTwo/ReadyPlayerTwo.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.aneeshsathe.readyplayertwo
        PRODUCT_NAME: ReadyPlayerTwo
        PROVISIONING_PROFILE_SPECIFIER: ""
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          ONLY_ACTIVE_ARCH: YES
        Release:
          CODE_SIGN_IDENTITY: "-"

  ReadyPlayerTwoTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: App/ReadyPlayerTwoTests
    dependencies:
      - target: ReadyPlayerTwo
    hostApplication: ReadyPlayerTwo
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aneeshsathe.readyplayertwo.tests
        PROVISIONING_PROFILE_SPECIFIER: ""
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          ONLY_ACTIVE_ARCH: YES
        Release:
          CODE_SIGN_IDENTITY: "-"

  ReadyPlayerTwoUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: App/ReadyPlayerTwoUITests
    dependencies:
      - target: ReadyPlayerTwo
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.aneeshsathe.readyplayertwo.ui-tests
        PROVISIONING_PROFILE_SPECIFIER: ""
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
          ONLY_ACTIVE_ARCH: YES
        Release:
          CODE_SIGN_IDENTITY: "-"

schemes:
  ReadyPlayerTwo:
    build:
      targets:
        ReadyPlayerTwo: all
        ReadyPlayerTwoTests:
          - test
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: ReadyPlayerTwoTests

  ReadyPlayerTwoPackagedAcceptance:
    build:
      targets:
        ReadyPlayerTwo: all
        ReadyPlayerTwoUITests:
          - test
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: ReadyPlayerTwoUITests
